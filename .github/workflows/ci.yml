name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: openai/gpt-oss-120b
          LLM_API_KEY: ci-test-key-not-real
