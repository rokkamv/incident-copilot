name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incident_copilot
          POSTGRES_PASSWORD: incident_copilot
          POSTGRES_DB: incident_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: openai/gpt-oss-120b
          LLM_API_KEY: ci-test-key-not-real
